<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background tile -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="#30363D" stroke-width="2"/>

  <!-- Antenna -->
  <line x1="32" y1="18" x2="32" y2="10" stroke="#34D399" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="32" cy="8.5" r="3.5" fill="#34D399" filter="url(#glow)"/>

  <!-- Ears/Side bolts -->
  <rect x="10" y="27" width="4" height="8" rx="2" fill="#30363D"/>
  <rect x="50" y="27" width="4" height="8" rx="2" fill="#30363D"/>

  <!-- Robot Head Base -->
  <rect x="13" y="18" width="38" height="30" rx="8" fill="#21262D" stroke="#30363D" stroke-width="2"/>

  <!-- Visor / Face screen -->
  <rect x="17" y="23" width="30" height="18" rx="5" fill="#0D1117"/>

  <!-- Glowing Robot Eyes (Emerald/Teal) -->
  <circle cx="25" cy="30" r="3.5" fill="#34D399" filter="url(#glow)"/>
  <circle cx="39" cy="30" r="3.5" fill="#34D399" filter="url(#glow)"/>

  <!-- Robot Smile / Visor Line -->
  <path d="M 27 36 Q 32 39 37 36" stroke="#34D399" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.9"/>
</svg>
